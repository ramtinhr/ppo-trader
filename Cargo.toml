[package]
name = "dynamic-trader"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
flate2 = "1.1.10"
nautilus-backtest = "0.65.0"
nautilus-common = "0.65.0"
nautilus-core = "0.65.0"
nautilus-execution = "0.65.0"
nautilus-model = "0.65.0"
nautilus-trading = "0.65.0"
rust_decimal = "1.43.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
