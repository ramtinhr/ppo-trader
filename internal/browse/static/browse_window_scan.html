<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window scan · combinations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #fafafa;
    --ink-soft: #d4d4d8;
    --muted: #a1a1aa;
    --faint: #71717a;
    --line: #27272a;
    --line-strong: #3f3f46;
    --paper: #09090b;
    --panel: #121214;
    --panel-2: #1a1a1e;
    --accent: #2dd4bf;
    --accent-hover: #5eead4;
    --accent-soft: rgba(45, 212, 191, 0.14);
    --pos: #4ade80;
    --neg: #fb7185;
    --warn: #fbbf24;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 18px 40px rgba(0, 0, 0, 0.45);
    --radius: 14px;
    --pad: 20px;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Sora", system-ui, sans-serif;
  }
  html[lang="fa"] {
    --sans: "Vazirmatn", "Sora", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 12% -18%, rgba(45, 212, 191, 0.12) 0%, transparent 55%),
      radial-gradient(700px 380px at 92% 0%, rgba(250, 250, 250, 0.04) 0%, transparent 50%),
      var(--paper);
    font: 14px/1.45 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  html[lang="fa"] body { line-height: 1.65; }
  .shell {
    max-width: 1480px;
    margin: 0 auto;
    padding: 28px var(--pad) 64px;
  }
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px 24px;
    margin-bottom: 22px;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: min(100%, 420px);
  }
  .top-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }
  html[dir="rtl"] .top-actions { align-items: flex-start; }
  .lang-toggle {
    display: inline-flex;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    overflow: hidden;
    background: var(--panel);
  }
  .lang-toggle button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 12px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .lang-toggle button.active {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .lang-toggle button:hover:not(.active) { color: var(--ink); }
  .eyebrow {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  html[lang="fa"] .eyebrow { letter-spacing: 0.06em; }
  h1 {
    margin: 0;
    font-size: clamp(1.55rem, 2.4vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  html[lang="fa"] h1 { letter-spacing: 0; }
  .sub {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
    max-width: 52ch;
  }
  .meta-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }
  html[dir="rtl"] .meta-strip { justify-content: flex-start; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }
  .chip b {
    color: var(--ink);
    font-family: var(--mono);
    font-weight: 500;
    font-size: 12px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .filters {
    padding: 16px 18px 14px;
    margin-bottom: 14px;
  }
  .filter-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .filter-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  html[lang="fa"] .filter-head h2 { letter-spacing: 0; }
  .hint {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    max-width: 70ch;
  }
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 10px 12px;
    align-items: end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  .field span {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  html[lang="fa"] .field span { letter-spacing: 0; text-transform: none; font-size: 12px; }
  select, input[type=number] {
    width: 100%;
    appearance: none;
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  select:focus, input[type=number]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: #222226;
  }
  select option { background: var(--panel-2); color: var(--ink); }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    grid-column: 1 / -1;
    padding-top: 4px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 0;
    border-radius: 8px;
    padding: 9px 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s, color .15s, border-color .15s, opacity .15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #042f2e;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line-strong);
  }
  .btn-secondary:hover { background: #242428; }
  .btn:disabled { opacity: .45; cursor: default; }
  .status {
    margin-inline-start: auto;
    color: var(--muted);
    font-size: 12px;
    font-family: var(--mono);
  }
  .status.busy { color: var(--warn); }
  .detail {
    display: none;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .detail.open { display: block; }
  .detail-inner { padding: 16px 18px; }
  .detail-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .detail-title {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  html[lang="fa"] .detail-title { letter-spacing: 0; }
  .detail-title .mono {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .results { overflow: hidden; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #161618, #121214);
  }
  .pager {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .pager .btn { padding: 7px 11px; font-weight: 500; }
  .page-jump {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
  }
  .page-jump input {
    width: 72px;
    padding: 6px 8px;
  }
  .info {
    color: var(--ink-soft);
    font-size: 12px;
  }
  .info strong {
    color: var(--ink);
    font-family: var(--mono);
    font-weight: 500;
  }
  .table-wrap {
    overflow: auto;
    max-height: min(70vh, 820px);
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  th, td {
    padding: 9px 12px;
    text-align: right;
    white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  th:first-child, td:first-child,
  th.l, td.l { text-align: left; }
  html[dir="rtl"] th:first-child, html[dir="rtl"] td:first-child,
  html[dir="rtl"] th.l, html[dir="rtl"] td.l { text-align: right; }
  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #1a1a1e;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line-strong);
  }
  html[lang="fa"] thead th {
    letter-spacing: 0;
    text-transform: none;
    font-size: 12px;
  }
  th[data-key] {
    cursor: pointer;
    user-select: none;
  }
  th[data-key]:hover { color: var(--accent); }
  th .ts-ind {
    margin-inline-start: 4px;
    color: var(--accent);
    font-size: 10px;
  }
  tbody tr {
    cursor: pointer;
    transition: background .12s;
  }
  tbody tr:hover { background: rgba(45, 212, 191, 0.08); }
  tbody tr.active { background: var(--accent-soft); }
  tbody tr:nth-child(even):not(.active):not(:hover) { background: rgba(255, 255, 255, 0.02); }
  .pos { color: var(--pos); font-weight: 500; }
  .neg { color: var(--neg); font-weight: 500; }
  .muted { color: var(--faint); }
  .pill {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    font-size: 11px;
  }
  .score-ok {
    background: var(--accent-soft);
    border-color: rgba(45, 212, 191, 0.35);
    color: var(--accent);
    font-weight: 600;
  }
  .empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--muted);
  }
  .empty h3 {
    margin: 0 0 6px;
    color: var(--ink);
    font-size: 16px;
  }
  .wf-panel { padding: 16px 18px; margin-bottom: 14px; display: none; }
  .wf-panel.visible { display: block; }
  .wf-head {
    display: flex; flex-wrap: wrap; align-items: baseline;
    justify-content: space-between; gap: 8px; margin-bottom: 12px;
  }
  .wf-head h2 {
    margin: 0; font-size: 13px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  }
  html[lang="fa"] .wf-head h2 { letter-spacing: 0; text-transform: none; }
  .wf-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 10px;
  }
  .wf-card {
    display: flex; flex-direction: column; gap: 8px;
    padding: 14px 14px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--panel-2); text-decoration: none; color: inherit;
    transition: border-color .15s, background .15s;
  }
  .wf-card:hover { border-color: var(--accent); background: var(--accent-soft); }
  .wf-card .wf-policy {
    font-size: 12px; font-weight: 600; color: var(--accent);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  html[lang="fa"] .wf-card .wf-policy { letter-spacing: 0; text-transform: none; }
  .wf-card .wf-total {
    font-family: var(--mono); font-size: 22px; font-weight: 700;
    letter-spacing: -0.02em;
  }
  .wf-card .wf-links { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; }
  .wf-card .wf-links a {
    color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line-strong);
  }
  .wf-card .wf-links a:hover { color: var(--accent); border-color: var(--accent); }
  @media (max-width: 1100px) {
    .filter-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .shell { padding: 18px 14px 40px; }
    .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .status { margin-inline-start: 0; width: 100%; }
    .table-wrap { max-height: 60vh; }
    .top-actions { width: 100%; align-items: stretch; }
    .meta-strip { justify-content: flex-start; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <p class="eyebrow" data-i18n="eyebrow">Window scan</p>
        <h1 data-i18n="title">Combinations</h1>
        <p class="sub" id="sub" data-i18n="loading">Loading scan…</p>
      </div>
      <div class="top-actions">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" id="lang-en" data-lang="en">EN</button>
          <button type="button" id="lang-fa" data-lang="fa">فارسی</button>
        </div>
        <div class="meta-strip" id="chips"></div>
      </div>
    </header>

    <section class="panel wf-panel" id="wf-panel">
      <div class="wf-head">
        <h2 data-i18n="wf_title">Walk-forward reports</h2>
        <p class="hint" data-i18n="wf_hint">Full tabbed reports for this scan (Stop / Allow short · EN / FA).</p>
      </div>
      <div class="wf-grid" id="wf-grid"></div>
    </section>

    <section class="panel filters">
      <div class="filter-head">
        <h2 data-i18n="filters">Filters</h2>
        <p class="hint" id="hint"></p>
      </div>
      <div class="filter-grid">
        <label class="field"><span data-i18n="window">Window</span><select id="window"></select></label>
        <label class="field"><span data-i18n="tf">Timeframe</span><select id="tf"></select></label>
        <label class="field"><span data-i18n="fast">RSI fast</span><select id="fast"></select></label>
        <label class="field"><span data-i18n="slow">RSI slow</span><select id="slow"></select></label>
        <label class="field"><span data-i18n="tp">Take-profit %</span><select id="tp"></select></label>
        <label class="field"><span data-i18n="sl">Stop-loss %</span><select id="sl"></select></label>
        <label class="field"><span data-i18n="leverage">Leverage</span><select id="leverage"></select></label>
        <label class="field"><span data-i18n="min_trades">Min. trades</span><input type="number" id="min_trades" min="0" value="0"></label>
        <label class="field"><span data-i18n="scored">Has score</span><select id="scored"><option value="1">Yes</option><option value="0">No</option></select></label>
        <label class="field"><span data-i18n="profitable">Profitable only</span><select id="profitable"><option value="0">No</option><option value="1">Yes</option></select></label>
        <label class="field"><span data-i18n="per">Rows / page</span><select id="per"><option>50</option><option selected>100</option><option>500</option></select></label>
        <div class="actions">
          <button class="btn btn-primary" id="go" type="button" data-i18n="search">Search</button>
          <a class="btn btn-secondary" id="csv" href="#" data-i18n="csv">Download CSV</a>
          <button class="btn btn-secondary" id="reset" type="button" data-i18n="reset">Reset</button>
          <span class="status" id="status"></span>
        </div>
      </div>
    </section>

    <section class="panel detail" id="detail">
      <div class="detail-inner" id="detail-body"></div>
    </section>

    <section class="panel results">
      <div class="toolbar">
        <div class="pager">
          <button class="btn btn-secondary" id="first" type="button" data-i18n="first">First</button>
          <button class="btn btn-secondary" id="prev" type="button" data-i18n="prev">Prev</button>
          <button class="btn btn-secondary" id="next" type="button" data-i18n="next">Next</button>
          <label class="page-jump"><span data-i18n="page">Page</span> <input type="number" id="jump" min="1" value="1"></label>
    </div>
        <div class="info" id="info"></div>
  </div>
      <div class="table-wrap"><table id="rows" data-no-auto-sort></table></div>
    </section>
  </div>

    page_of: 'صفحه <strong>{page}</strong> از <strong>{pages}</strong>',
    matches: '<strong>{n}</strong> مورد',
    trunc: ' · نمایش بهترین <strong>{kept}</strong> از <strong>{matched}</strong> (برای بقیه فیلتر را تنگ‌تر کنید)',
    empty_title: 'هیچ ترکیبی پیدا نشد',
    empty_body: 'فیلترها را بازتر کنید یا «دارای امتیاز» / «فقط سودده» را خاموش کنید.',
    few_trades: 'معامله کم',
    sort_title: 'کلیک برای مرتب‌سازی · Shift+کلیک برای افزودن',
    col_rank: 'رتبه',
    col_tf: 'TF',
    col_fast: 'سریع',
    col_slow: 'کند',
    col_tp: 'سود ٪',
    col_sl: 'ضرر ٪',
    col_lev: 'اهرم',
    col_profit: 'سود',
    col_drop: 'سقوط',
    col_win: 'برد ٪',
    col_trusted: 'برد معتبر ٪',
    col_worst: 'بدترین',
    col_hold: 'نگهداری',
    col_trades: 'معاملات',
    col_score: 'امتیاز',
    col_window: 'پنجره',
    detail_total: 'جمع همه پنجره‌ها: <strong>{money}</strong> دلار',
    close: 'بستن',
    wf_title: 'گزارش‌های بازآزمایی پیشرونده',
    wf_hint: 'گزارش کامل با تب برای این اسکن (توقف / اجازه کوتاه · EN / فارسی).',
    wf_stop: 'توقف (اصلی)',
    wf_allow: 'اجازه کوتاه',
    wf_open: 'باز کردن EN',
    wf_open_fa: 'باز کردن فارسی',
    wf_pnl: 'سود و زیان کل',
  },
};

const LANG_KEY = 'browse_window_scan_lang';
let lang = localStorage.getItem(LANG_KEY) === 'fa' ? 'fa' : 'en';
const t = (key, vars = {}) => {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  Object.entries(vars).forEach(([k, v]) => { s = s.replaceAll(`{${k}}`, String(v)); });
  return s;
};
const locale = () => (lang === 'fa' ? 'fa-IR' : 'en-US');

const $ = (s) => document.querySelector(s);
const fmt = (x, d = 2) => Number.isFinite(x)
  ? Number(x).toLocaleString(locale(), { minimumFractionDigits: d, maximumFractionDigits: d })
  : '–';
const money = (x) => `<span class="${x > 0 ? 'pos' : x < 0 ? 'neg' : ''}">${x > 0 ? '+' : ''}${fmt(x)}</span>`;
const pct = (x) => `${fmt(x, 0)}%`;
const score = (x) => x === null
  ? `<span class="pill muted">${t('few_trades')}</span>`
  : `<span class="pill score-ok">${fmt(x, 3)}</span>`;

let META, page = 0, activeId = null, lastResult = null, WF_REPORTS = [];

const opts = (el, values, label = (v) => v) => {
  el.innerHTML = `<option value="any">${t('any')}</option>` +
    values.map((v) => `<option value="${v}">${label(v)}</option>`).join('');
};
const params = () => new URLSearchParams(Object.fromEntries(
  ['window', 'tf', 'fast', 'slow', 'tp', 'sl', 'leverage', 'min_trades', 'scored', 'profitable', 'per']
    .map((k) => [k, $('#' + k).value])
    .concat([['sort', sortParam()]])
));
const cells = (x) =>
  `<td><b>${money(x.profit)}</b></td><td>${fmt(x.drop)}</td><td>${pct(x.win_rate)}</td><td>${pct(x.trusted_win_rate)}</td><td>${money(x.worst)}</td><td>${fmt(x.hold_hours, 1)}h</td><td>${x.trades.toLocaleString(locale())}</td><td>${score(x.score)}</td>`;

let SORT = [{ key: 'score', dir: -1 }];
function clickSort(key, add) {
  const i = SORT.findIndex((s) => s.key === key);
  if (!add) SORT = SORT.length === 1 && i === 0 ? [{ key, dir: -SORT[0].dir }] : [{ key, dir: -1 }];
  else if (i < 0) SORT = [...SORT, { key, dir: -1 }];
  else if (SORT[i].dir < 0) SORT = SORT.map((s, j) => (j === i ? { key, dir: 1 } : s));
  else SORT = SORT.filter((_, j) => j !== i);
  if (!SORT.length) SORT = [{ key: 'score', dir: -1 }];
  search(0);
}
const sortParam = () => SORT.map((s) => `${s.key}-${s.dir > 0 ? 'asc' : 'desc'}`).join('.');
const colDefs = () => [
  [t('col_rank'), null, 'l'],
  [t('col_tf'), 'tf'],
  [t('col_fast'), 'fast'],
  [t('col_slow'), 'slow'],
  [t('col_tp'), 'tp'],
  [t('col_sl'), 'sl'],
  [t('col_lev'), 'leverage'],
  [t('col_profit'), 'profit'],
  [t('col_drop'), 'drop'],
  [t('col_win'), 'win_rate'],
  [t('col_trusted'), 'trusted'],
  [t('col_worst'), 'worst'],
  [t('col_hold'), 'hold'],
  [t('col_trades'), 'trades'],
  [t('col_score'), 'score'],
];
const sortHead = (cols) => cols.map(([label, key, align]) => {
  if (!key) return `<th class="${align || ''}">${label}</th>`;
  const i = SORT.findIndex((s) => s.key === key);
  const arrow = i < 0 ? '' : `<span class="ts-ind">${SORT[i].dir > 0 ? '▲' : '▼'}${SORT.length > 1 ? i + 1 : ''}</span>`;
  return `<th class="${align || ''}" data-key="${key}" title="${t('sort_title')}">${label}${arrow}</th>`;
}).join('');
const metricHead = () =>
  `<th>${t('col_profit')}</th><th>${t('col_drop')}</th><th>${t('col_win')}</th><th>${t('col_trusted')}</th><th>${t('col_worst')}</th><th>${t('col_hold')}</th><th>${t('col_trades')}</th><th>${t('col_score')}</th>`;

function setBusy(on, msg) {
  $('#go').disabled = on;
  const st = $('#status');
  st.textContent = msg || '';
  st.classList.toggle('busy', on);
}

function fillYesNo(sel, yesVal) {
  const v = sel.value;
  sel.innerHTML = `<option value="1">${t('yes')}</option><option value="0">${t('no')}</option>`;
  sel.value = v || yesVal;
}

function applyStaticI18n() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  document.title = t('title_doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (key && I18N.en[key] !== undefined) el.textContent = t(key);
  });
  $('#lang-en').classList.toggle('active', lang === 'en');
  $('#lang-fa').classList.toggle('active', lang === 'fa');
  fillYesNo($('#scored'), '1');
  fillYesNo($('#profitable'), '0');
  if (META) {
    $('#hint').innerHTML = t('hint', { mindrop: META.min_drop, mintrades: META.min_trades });
    renderMeta();
    // refresh Any labels on strategy selects without wiping window
    const keep = Object.fromEntries(['tf', 'fast', 'slow', 'tp', 'sl', 'leverage'].map((k) => [k, $('#' + k).value]));
    opts($('#tf'), META.timeframes, (v) => v + 'm');
    opts($('#fast'), META.lengths);
    opts($('#slow'), META.lengths);
    opts($('#tp'), META.tp);
    opts($('#sl'), META.sl);
    opts($('#leverage'), META.leverage || [1], (v) => v + 'x');
    Object.entries(keep).forEach(([k, v]) => { $('#' + k).value = v; });
  } else {
    $('#hint').textContent = '';
  }
}

function renderMeta() {
  if (!META) return;
  const hours = META.hours ?? (META.days * 24);
  const dayLabel = hours === 24 ? t('day_to_day')
    : (hours % 24 === 0 ? t('day_windows', { n: hours / 24 }) : `${hours}h`);
  $('#sub').textContent = t('sub', {
    combos: META.combinations.toLocaleString(locale()),
    windows: META.windows.length.toLocaleString(locale()),
    days: dayLabel,
  });
  const outer = hours === 24 ? t('outer_1d')
    : (hours % 24 === 0 ? t('outer_nd', { n: hours / 24 }) : `${hours}h`);
  $('#chips').innerHTML = [
    [t('chip_combos'), META.combinations.toLocaleString(locale())],
    [t('chip_windows'), String(META.windows.length)],
    [t('chip_outer'), outer],
    [t('chip_tf'), String(META.timeframes.length)],
    [t('chip_rsi'), String(META.lengths.length)],
    [t('chip_tpsl'), `${META.tp.length}×${META.sl.length}×${(META.leverage || [1]).length}`],
  ].map(([k, v]) => `<span class="chip">${k} <b>${v}</b></span>`).join('');
}

function renderWf() {
  const panel = $('#wf-panel');
  const grid = $('#wf-grid');
  if (!WF_REPORTS.length) {
    panel.classList.remove('visible');
    grid.innerHTML = '';
    return;
  }
  panel.classList.add('visible');
  grid.innerHTML = WF_REPORTS.map((r) => {
    const label = (String(r.stem).includes('allow_short') || String(r.policy) === 'allow_short')
      ? t('wf_allow') : t('wf_stop');
    const total = Number.isFinite(r.total)
      ? `<div class="wf-total ${r.total > 0 ? 'pos' : r.total < 0 ? 'neg' : ''}">${r.total > 0 ? '+' : ''}${fmt(r.total)}</div>`
      : `<div class="wf-total" style="color:var(--faint)">–</div>`;
    const links = [];
    if (r.html) links.push(`<a href="${r.href}" target="_blank" rel="noopener">${t('wf_open')}</a>`);
    if (r.html_fa) links.push(`<a href="${r.href_fa}" target="_blank" rel="noopener">${t('wf_open_fa')}</a>`);
    return `<div class="wf-card">
      <div class="wf-policy">${label}</div>
      <div style="font-size:11px;color:var(--muted)">${t('wf_pnl')}</div>
      ${total}
      <div class="wf-links">${links.join('')}</div>
    </div>`;
  }).join('');
}

function setLang(next) {
  if (next !== 'en' && next !== 'fa') return;
  lang = next;
  localStorage.setItem(LANG_KEY, lang);
  applyStaticI18n();
  renderWf();
  if (lastResult) renderRows(lastResult);
  else if (META) search(page);
  if (activeId != null) detail(activeId);
}

async function load() {
  applyStaticI18n();
  META = await (await fetch('/api/meta')).json();
  try {
    const wr = await (await fetch('/api/reports')).json();
    WF_REPORTS = wr.reports || [];
  } catch (_) {
    WF_REPORTS = [];
  }
  applyStaticI18n();
  renderWf();
  $('#window').innerHTML = META.windows.map((w) =>
    `<option value="${w.start}">${w.start} → ${w.end}</option>`
  ).join('');
  opts($('#tf'), META.timeframes, (v) => v + 'm');
  opts($('#fast'), META.lengths);
  opts($('#slow'), META.lengths);
  opts($('#tp'), META.tp);
  opts($('#sl'), META.sl);
  opts($('#leverage'), META.leverage || [1], (v) => v + 'x');
  search(0);
}

function renderRows(r) {
  lastResult = r;
  const pages = Math.max(1, Math.ceil(r.kept / r.per));
  const trunc = r.kept < r.matched
    ? t('trunc', {
        kept: r.kept.toLocaleString(locale()),
        matched: r.matched.toLocaleString(locale()),
      })
    : '';
  $('#info').innerHTML =
    t('page_of', { page: (page + 1).toLocaleString(locale()), pages: pages.toLocaleString(locale()) }) +
    ` · ${t('matches', { n: r.matched.toLocaleString(locale()) })}${trunc}` +
    (r.seconds ? ` · <strong>${fmt(r.seconds, 1)}</strong>s` : '');
  $('#prev').disabled = $('#first').disabled = page === 0;
  $('#next').disabled = page + 1 >= pages;
  if (!r.rows.length) {
    $('#rows').innerHTML = `<tbody><tr><td colspan="15"><div class="empty"><h3>${t('empty_title')}</h3><p>${t('empty_body')}</p></div></td></tr></tbody>`;
    return;
  }
  $('#rows').innerHTML = `<thead><tr>${sortHead(colDefs())}</tr></thead><tbody>${
    r.rows.map((x) => `<tr data-id="${x.id}" class="${String(x.id) === String(activeId) ? 'active' : ''}">
      <td class="l">${x.rank.toLocaleString(locale())}</td>
      <td>${x.tf}m</td><td>${x.fast}</td><td>${x.slow}</td><td>${x.tp}</td><td>${x.sl}</td><td>${x.leverage}x</td>
      ${cells(x)}
    </tr>`).join('')
  }</tbody>`;
  document.querySelectorAll('#rows tbody tr').forEach((tr) => {
    tr.addEventListener('click', () => detail(tr.dataset.id));
  });
  document.querySelectorAll('#rows th[data-key]').forEach((th) => {
    th.addEventListener('click', (e) => clickSort(th.dataset.key, e.shiftKey || e.ctrlKey || e.metaKey));
  });
}

async function search(p) {
  page = Math.max(0, p);
  const q = params();
  q.set('page', page);
  $('#csv').href = '/api/csv?' + params();
  $('#jump').value = String(page + 1);
  setBusy(true, t('searching'));
  $('#info').textContent = t('searching');
  let r;
  try {
    r = await (await fetch('/api/query?' + q)).json();
  } catch (e) {
    setBusy(false, t('failed'));
    $('#info').textContent = t('unreachable');
    return;
  }
  setBusy(false, r.seconds ? `${fmt(r.seconds, 1)}s` : '');
  if (r.error) {
    $('#info').textContent = r.error;
    $('#rows').innerHTML = '';
    lastResult = null;
    return;
  }
  renderRows(r);
}

async function detail(id) {
  activeId = id;
  document.querySelectorAll('#rows tbody tr').forEach((tr) => {
    tr.classList.toggle('active', tr.dataset.id === String(id));
  });
  const d = await (await fetch('/api/combo/' + id)).json();
  const c = d.combo;
  const total = d.windows.reduce((a, w) => a + w.profit, 0);
  const el = $('#detail');
  el.classList.add('open');
  $('#detail-body').innerHTML = `
    <div class="detail-bar">
      <h3 class="detail-title">
        ${c.tf}m · RSI ${c.fast}/${c.slow}
        <span class="mono"> · TP ${c.tp}% · SL ${c.sl}% · ${c.leverage}x</span>
      </h3>
      <div class="info">${t('detail_total', { money: money(total) })}
        <button class="btn btn-secondary" id="close-detail" type="button" style="margin-inline-start:10px">${t('close')}</button>
      </div>
    </div>
    <div class="table-wrap" style="max-height:360px">
      <table>
        <thead><tr><th class="l">${t('col_window')}</th>${metricHead()}</tr></thead>
        <tbody>${d.windows.map((w) =>
          `<tr><td class="l">${w.start} → ${w.end}</td>${cells(w)}</tr>`
        ).join('')}</tbody>
      </table>
    </div>`;
  $('#close-detail').addEventListener('click', () => {
    el.classList.remove('open');
    activeId = null;
    document.querySelectorAll('#rows tbody tr.active').forEach((tr) => tr.classList.remove('active'));
  });
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function resetFilters() {
  if (!META) return;
  $('#window').selectedIndex = 0;
  ['tf', 'fast', 'slow', 'tp', 'sl', 'leverage'].forEach((k) => { $('#' + k).value = 'any'; });
  $('#min_trades').value = '0';
  $('#scored').value = '1';
  $('#profitable').value = '0';
  $('#per').value = '100';
  SORT = [{ key: 'score', dir: -1 }];
  search(0);
}

$('#lang-en').addEventListener('click', () => setLang('en'));
$('#lang-fa').addEventListener('click', () => setLang('fa'));
$('#go').addEventListener('click', () => search(0));
$('#reset').addEventListener('click', resetFilters);
$('#first').addEventListener('click', () => search(0));
$('#prev').addEventListener('click', () => search(page - 1));
$('#next').addEventListener('click', () => search(page + 1));
$('#jump').addEventListener('change', (e) => search(Number(e.target.value) - 1));
document.querySelector('.filters').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); search(0); }
});
['tf', 'fast', 'slow', 'tp', 'sl', 'leverage', 'scored', 'profitable', 'per'].forEach((id) => {
  $('#' + id).addEventListener('change', () => search(0));
});
load();
</script>
<script>/*__TABLE_SORT__*/</script>
</body>
